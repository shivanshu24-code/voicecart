<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 888" width="1200" height="888" role="img" aria-label="VoiceCart architecture: shop owners and customers use the Next.js frontend, which calls the Fastify API. The API uses Supabase, Sarvam and Gemini. Photos upload to Cloudinary, and customer orders reach shop owners through WhatsApp.">
